


   <!--
  footer.html — REFERENCE COPY ONLY.

  This file is not loaded directly by the browser (a plain static site can't

  To add the footer to a page, put this right before </body>:

    <div id="footer-placeholder"></div>

  follow whatever theme (body.light / body.dark) is already active on the
  page, using the same toggle from theme.js. The copyright year is written
  directly in the markup (2026) — update it by hand when the year changes.
-->
